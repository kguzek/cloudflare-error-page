version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 15

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

    groups:
      cloudflare:
        patterns:
          - "@cloudflare/*"
          - "wrangler"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
